<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>Gerador de Orçamentos MasterServ</title>
  <meta name="description" content="Gerador de orçamentos, ordens de serviço e laudos técnicos da MasterServ Limeira." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar no-print">
      <div class="brand-lockup">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M50 4 L88 18 V48 C88 75 72 90 50 97 C28 90 12 75 12 48 V18 Z" fill="var(--navy)"/>
            <circle cx="50" cy="53" r="11" fill="none" stroke="#fff" stroke-width="5"/>
            <circle cx="50" cy="53" r="2.6" fill="#fff"/>
            <g fill="#fff">
              <rect x="47" y="31" width="6" height="8" rx="1.2" transform="rotate(0 50 53)"/>
              <rect x="47" y="31" width="6" height="8" rx="1.2" transform="rotate(45 50 53)"/>
              <rect x="47" y="31" width="6" height="8" rx="1.2" transform="rotate(90 50 53)"/>
              <rect x="47" y="31" width="6" height="8" rx="1.2" transform="rotate(135 50 53)"/>
              <rect x="47" y="31" width="6" height="8" rx="1.2" transform="rotate(180 50 53)"/>
              <rect x="47" y="31" width="6" height="8" rx="1.2" transform="rotate(225 50 53)"/>
              <rect x="47" y="31" width="6" height="8" rx="1.2" transform="rotate(270 50 53)"/>
              <rect x="47" y="31" width="6" height="8" rx="1.2" transform="rotate(315 50 53)"/>
            </g>
          </svg>
        </div>
        <div>
          <strong>MasterServ</strong>
          <span>Limeira</span>
          <small>SERVIÇOS TÉCNICOS</small>
        </div>
      </div>
      <div class="topbar-center">
        <span class="eyebrow">OFICINA EDITORIAL</span>
        <h1>Gerador de documentos técnicos</h1>
        <p>Escolha um modelo, preencha os dados e imprima ou baixe em PDF.</p>
      </div>
      <div class="status"><span class="status-dot"></span> Pronto para gerar</div>
    </header>

    <section class="workspace">
      <aside class="editor no-print" id="editor"></aside>
      <section class="preview-area">
        <div class="preview-toolbar no-print">
          <span><span class="preview-dot"></span> PRÉVIA DO DOCUMENTO</span>
          <span id="preview-meta">A4 · 1 página</span>
        </div>
        <article class="paper" id="paper"></article>
      </section>
    </section>
  </main>

  <div id="download-overlay" class="download-overlay" hidden>
    <div class="download-box">
      <div class="spinner"></div>
      <span>Gerando PDF…</span>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
